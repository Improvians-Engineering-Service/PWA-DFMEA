<!doctype html><html><head><meta charset="utf-8"><script src="js/theme.js"></script>
<script>
(function(){
  try{
    var auth = JSON.parse(localStorage.getItem("dfmeaAuth") || "null");
    if(!auth || !auth.loggedIn) window.location.replace("login.html");
  }catch(error){ window.location.replace("login.html"); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
<style>
.rv-wrap{max-width:920px;margin:28px auto 40px;padding:0 22px}
.rv-card{background:#fff;border:1px solid #E4EAF2;border-radius:16px;padding:26px 28px;
 box-shadow:0 1px 2px rgba(15,23,42,.04),0 16px 40px -18px rgba(15,23,42,.14)}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
.rv-prod{font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-.4px}
.rv-meta{font-size:11.5px;color:#94A3B8;margin-bottom:20px}
.rv-specs{border:1px solid #E4EAF2;border-radius:12px;overflow:hidden}
.rv-link{font-size:11.5px;font-weight:700;color:var(--p700);text-decoration:none;display:inline-flex;align-items:center;margin-right:8px}
.rv-link:hover{text-decoration:underline}
.rv-notfound{text-align:center;color:#94A3B8;padding:60px 20px}
.rv-actions{display:flex;align-items:center;gap:8px}
.rv-btn{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;
 border:1px solid #DCE3EC;background:#fff;color:#334155;box-shadow:0 1px 2px rgba(15,23,42,.04);
 transition:background-color .15s ease,border-color .15s ease}
.rv-btn:hover{background:#F8FAFC;border-color:#C3CEDC}
.rv-btn.primary{background:var(--p600);border-color:var(--p600);color:#fff;box-shadow:0 1px 2px rgb(var(--p600-rgb) / .2),0 6px 14px -4px rgb(var(--p600-rgb) / .4)}
.rv-btn.primary:hover{background:var(--p700);border-color:var(--p700)}
.rv-speceditrow{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.rv-speceditrow textarea{flex:1;box-sizing:border-box;padding:8px 11px;border:1px solid #DCE3EC;border-radius:9px;font-size:12px;color:#1E293B;resize:vertical;min-height:40px;line-height:1.5}
.rv-speceditrow textarea:focus{outline:none;border-color:var(--p400);box-shadow:0 0 0 3px var(--p50)}
.rv-rm{flex:none;width:30px;height:30px;margin-top:5px;border-radius:8px;border:1px solid #DCE3EC;background:#fff;color:#94A3B8;cursor:pointer;font-size:15px;line-height:1}
.rv-rm:hover{background:#FEF2F2;color:#B91C1C;border-color:#FCA5A5}
.rv-addbtn{font-size:11.5px;font-weight:700;color:var(--p700);background:none;border:none;cursor:pointer;padding:6px 0}
.rv-addbtn:hover{text-decoration:underline}
.rv-saverow{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #F1F5F9}
.rv-saverow .rv-btn.primary{margin-left:auto}
</style>
</head>
<body><div class="app">
<div class="main">
  <div class="sa-head">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/><path d="M9.5 13.5l2 2 3.5-4"/></svg></div>
    <span class="sa-brand">DFMEA</span>
    <span class="sa-sep"></span>
    <a href="requirement-specs.html" class="sa-back">&lsaquo; Back to Design Requirements</a>
  </div>
  <div class="rv-wrap" id="rvWrap"></div>
</div>
</div>
<script src="js/table-tools.js"></script>
<script src="js/req-docs.js"></script>
<script src="js/references.js"></script>
<script src="js/assistant.js"></script>
<script>
(function(){
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id") || "";

  function escapeHtml(value){
    var div = document.createElement("div");
    div.textContent = String(value);
    return div.innerHTML;
  }

  var doc = window.DfmeaReqDocs.getById(id);
  var wrap = document.getElementById("rvWrap");
  if(!doc){
    wrap.innerHTML = '<div class="rv-notfound">This specification could not be found.</div>';
    return;
  }
  var standardLabel = doc.standard === "None" ? "No specific standard" : doc.standard;
  document.title = doc.productName + " - DFMEA";
  var editing = false;

  function downloadSpec(){
    var lines = [doc.productName, "Standard: " + standardLabel, "Created: " + doc.createdAt, "", "Design requirement specification:"];
    (doc.specs || []).forEach(function(s, i){ lines.push((i + 1) + ". " + s); });
    var blob = new Blob([lines.join("\n")], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = doc.productName.replace(/[^a-z0-9]+/gi, "_") + "_requirement_spec.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function render(){
    var head = '<div class="rv-head"><span class="rv-prod">' + escapeHtml(doc.productName) + '</span><span class="req-standard">' + escapeHtml(standardLabel) + '</span></div>'
      + '<div class="rv-meta">Design requirement specification &middot; ' + escapeHtml(doc.createdAt) + '</div>';

    var body;
    if(!editing){
      body = '<div class="rv-specs">' + window.DfmeaReqDocs.specTableHtml(doc.specs, doc) + '</div>'
        + '<div class="rv-actions" style="margin-top:20px">'
        + (doc.projectId ? '<a class="rv-link" href="project.html?id=' + encodeURIComponent(doc.projectId) + '">View project &rsaquo;</a>' : "")
        + '<button type="button" class="rv-btn" id="rvDownloadBtn">Download</button>'
        + '<button type="button" class="rv-btn primary" id="rvEditBtn" style="margin-left:auto">Edit specification</button>'
        + '</div>';
    }else{
      body = '<div id="rvSpecEdit">' + (doc.specs || []).map(function(s, i){
          return '<div class="rv-speceditrow" data-i="' + i + '"><textarea>' + escapeHtml(s) + '</textarea><button type="button" class="rv-rm" data-rm="' + i + '" title="Remove">&times;</button></div>';
        }).join("") + '</div>'
        + '<button type="button" class="rv-addbtn" id="rvAddSpec">+ Add specification line</button>'
        + '<div class="rv-saverow"><button type="button" class="rv-btn" id="rvCancelBtn">Cancel</button><button type="button" class="rv-btn primary" id="rvSaveBtn">Save changes</button></div>';
    }
    wrap.innerHTML = '<div class="rv-card">' + head + body + '</div>';
    if(!editing) window.DfmeaReqDocs.enhanceSpecTable(wrap.querySelector(".rv-specs"));

    if(!editing){
      document.getElementById("rvEditBtn").addEventListener("click", function(){ editing = true; render(); });
      document.getElementById("rvDownloadBtn").addEventListener("click", downloadSpec);
    }else{
      document.getElementById("rvAddSpec").addEventListener("click", function(){
        var list = document.getElementById("rvSpecEdit");
        var row = document.createElement("div");
        row.className = "rv-speceditrow";
        row.innerHTML = '<textarea></textarea><button type="button" class="rv-rm" title="Remove">&times;</button>';
        list.appendChild(row);
        row.querySelector(".rv-rm").addEventListener("click", function(){ row.remove(); });
        row.querySelector("textarea").focus();
      });
      Array.prototype.slice.call(wrap.querySelectorAll(".rv-rm")).forEach(function(btn){
        btn.addEventListener("click", function(){ btn.closest(".rv-speceditrow").remove(); });
      });
      document.getElementById("rvCancelBtn").addEventListener("click", function(){ editing = false; render(); });
      document.getElementById("rvSaveBtn").addEventListener("click", function(){
        var specs = Array.prototype.slice.call(wrap.querySelectorAll("#rvSpecEdit textarea"))
          .map(function(t){ return t.value.trim(); }).filter(Boolean);
        window.DfmeaReqDocs.updateSpecs(doc.id, specs);
        doc.specs = specs;
        editing = false;
        render();
      });
    }
  }
  render();
})();
</script>
</body></html>
