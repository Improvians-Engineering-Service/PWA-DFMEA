<!doctype html><html><head><meta charset="utf-8"><script src="js/theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - DFMEA</title>
<link rel="stylesheet" href="css/style.css">
<style>
body.login-body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;
 background:radial-gradient(900px 520px at 12% -8%,var(--p100) 0%,transparent 62%),
  radial-gradient(760px 480px at 100% 108%,var(--p50) 0%,transparent 60%),var(--bg);
 font-family:Cambria, "Cambria Math", Georgia, "Times New Roman", serif}
.login-card{width:380px;max-width:100%;background:#fff;border:1px solid #E4EAF2;border-radius:16px;
 box-shadow:0 1px 2px rgba(15,23,42,.04),0 24px 60px -20px rgba(30,27,75,.18);padding:34px 32px 32px}
.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.login-brand .logo{width:38px;height:38px;color:var(--p600);display:flex;align-items:center;justify-content:center;flex:none}
.login-brand .logo svg{width:30px;height:30px}
.login-brand .bn{font-weight:800;font-size:15.5px;color:#0F172A;letter-spacing:-.2px}
.login-brand .bs{font-size:9.5px;letter-spacing:.6px;color:#94A3B8;font-weight:700;margin-top:2px}
.login-title{font-size:21px;font-weight:800;color:#0F172A;letter-spacing:-.4px;margin-bottom:5px}
.login-sub{font-size:12.5px;color:#64748B;margin-bottom:24px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:11.5px;font-weight:600;color:#334155;margin-bottom:7px}
.login-field input{width:100%;box-sizing:border-box;height:40px;padding:0 12px;border:1px solid #DCE3EC;border-radius:9px;
 font-size:13px;color:#0F172A;background-color:#fff;transition:border-color .15s ease,box-shadow .15s ease}
.login-field input:hover{border-color:#C3CEDC}
.login-field input:focus{outline:none;border-color:var(--p400);box-shadow:0 0 0 3px var(--p50)}
.login-field input.err{border-color:#FCA5A5;background-color:#FEF2F2}
.login-field .err-msg{display:none;color:#B91C1C;font-size:10.5px;margin-top:6px;font-weight:600}
.login-field.has-err .err-msg{display:block}
.login-btn{width:100%;height:42px;border:none;border-radius:10px;background:var(--p600);color:#fff;
 font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;
 box-shadow:0 1px 2px rgb(var(--p600-rgb) / .2),0 8px 18px -6px rgb(var(--p600-rgb) / .55);
 transition:background-color .15s ease,transform .12s ease}
.login-btn:hover{background:var(--p700)}
.login-btn:active{transform:scale(.99)}
.login-form-err{display:none;margin-bottom:16px;padding:10px 12px;border-left:3px solid #DC2626;background:#FEF2F2;
 color:#B91C1C;font-size:11.5px;font-weight:600;border-radius:6px}
.login-form-err.show{display:block}
</style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/><path d="M9.5 13.5l2 2 3.5-4"/></svg></div>
      <div><div class="bn">DFMEA</div><div class="bs">PROJECT RISK ANALYSIS</div></div>
    </div>
    <div class="login-title">Sign in</div>
    <div class="login-sub">Enter your work email and password to continue.</div>
    <div class="login-form-err" id="loginFormErr">Enter both your email and password to sign in.</div>
    <form id="loginForm" novalidate>
      <div class="login-field" id="emailField">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" value="engineer@gmail.com" placeholder="you@company.com" autocomplete="username">
        <div class="err-msg" id="emailErr">Enter your email address.</div>
      </div>
      <div class="login-field" id="passwordField">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" value="demo1234" placeholder="Enter your password" autocomplete="current-password">
        <div class="err-msg" id="passwordErr">Enter your password.</div>
      </div>
      <button type="submit" class="login-btn">Sign in</button>
    </form>
  </div>
<script>
(function(){
  "use strict";
  // Already signed in from an earlier visit? Skip straight to the dashboard
  // instead of making them log in again every time.
  // Nothing uploaded yet? Send people to Legacy DFMEA first instead of an
  // empty-feeling dashboard -- that's the step that actually needs doing,
  // and the page explains up front why it matters (it trains the model).
  function landingPage(){
    try{
      var history = JSON.parse(localStorage.getItem("dfmeaUploadHistory") || "[]");
      return history.length ? "index.html" : "upload.html";
    }catch(error){ return "index.html"; }
  }

  try{
    var existing = JSON.parse(localStorage.getItem("dfmeaAuth") || "null");
    if(existing && existing.loggedIn) window.location.replace(landingPage());
  }catch(error){ /* corrupted storage -- just show the login form */ }

  var form = document.getElementById("loginForm");
  var emailInput = document.getElementById("loginEmail");
  var passwordInput = document.getElementById("loginPassword");
  var emailField = document.getElementById("emailField");
  var passwordField = document.getElementById("passwordField");
  var formErr = document.getElementById("loginFormErr");

  function isValidEmail(value){
    // A real, if simple, format check -- not just "is it non-empty".
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  form.addEventListener("submit", function(event){
    event.preventDefault();
    var email = emailInput.value.trim();
    var password = passwordInput.value;
    var emailOk = isValidEmail(email);
    var passwordOk = password.length > 0;

    emailField.classList.toggle("has-err", !emailOk);
    emailInput.classList.toggle("err", !emailOk);
    document.getElementById("emailErr").textContent = email
      ? "Enter a valid email address, like you@company.com."
      : "Enter your email address.";

    passwordField.classList.toggle("has-err", !passwordOk);
    passwordInput.classList.toggle("err", !passwordOk);

    formErr.classList.toggle("show", !emailOk || !passwordOk);

    if(!emailOk || !passwordOk){
      (emailOk ? passwordInput : emailInput).focus();
      return;
    }

    try{
      localStorage.setItem("dfmeaAuth", JSON.stringify({ loggedIn: true, email: email, since: Date.now() }));
    }catch(error){ /* storage unavailable -- proceed anyway, just won't persist across reloads */ }
    window.location.href = landingPage();
  });

  [emailInput, passwordInput].forEach(function(input){
    input.addEventListener("input", function(){
      var field = input.closest(".login-field");
      field.classList.remove("has-err");
      input.classList.remove("err");
      formErr.classList.remove("show");
    });
  });
})();
</script>
</body></html>
