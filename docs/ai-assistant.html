<!doctype html><html><head><meta charset="utf-8"><script src="js/theme.js"></script>
<script>
(function(){
  try{
    var auth = JSON.parse(localStorage.getItem("dfmeaAuth") || "null");
    if(!auth || !auth.loggedIn) window.location.replace("login.html");
  }catch(error){ window.location.replace("login.html"); }
})();
</script>
<link rel="stylesheet" href="css/style.css">
<style>
.aip-wrap{max-width:900px;margin:0 auto}
.aip-card{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px;background:#fff;border:1px solid #E4EAF2;border-radius:14px;overflow:hidden;
 box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -16px rgba(15,23,42,.14)}
.aip-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #EEF2F7;background:linear-gradient(180deg,var(--p25),#fff)}
.aip-bar b{font-size:13px;color:#0F172A}
.aip-bar span{font-size:11.5px;color:#64748B}
.aip-bar button{margin-left:auto;height:30px;padding:0 12px;border:1px solid #E2E8F0;border-radius:8px;background:#fff;color:#475569;font-size:11.5px;font-weight:600;cursor:pointer}
.aip-bar button:hover{background:var(--p25);border-color:var(--p200);color:var(--p700)}
.aip-card .ac{flex:1}
.aip-card .ac-msgs{padding:20px}
.aip-card .ac-bubble{font-size:12.5px}
</style>
</head>
<body><div class="app">

<div class="side">
  <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/><path d="M9.5 13.5l2 2 3.5-4"/></svg></div>
    <div><div class="bn">DFMEA</div><div class="bs">PROJECT RISK ANALYSIS</div></div></div>
  <div class="nav" id="navUploadData"><span class="ni"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5M12 5v12"/></svg></span>Legacy DFMEA</div><div class="nav" id="navReqSpecs"><span class="ni"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M9 12l2 2 4-4"/></svg></span>Design Requirements</div><div class="nav" id="navDfmea"><span class="ni"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>Projects</div><div class="subnav on"><span>TAK50</span></div>
  <div class="sfoot" id="sfootUser" data-tip="Signed in as D. Whitaker"><div class="av">DW</div>
    <div><div class="un">D. Whitaker</div><div class="ur">Lead Design Engineer</div></div>
    <span class="coll" id="logoutBtn" data-tip="Log out"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span></div>
</div>

<div class="main">
  <div class="top">
    <div>
      <div class="crumb">DFMEA &rsaquo; <b>AI Assistant</b></div>
      <div class="ttl">AI Assistant</div>
    </div>
  </div>

  <div class="content">
    <div class="aip-wrap">
      <div class="aip-card">
        <div class="aip-bar"><b>Ask me anything</b><span>about your DFMEAs, requirements, references and standards</span><button type="button" id="aiPageClear">New chat</button></div>
        <div id="aiPageChat" style="flex:1;min-height:0;display:flex"></div>
      </div>
    </div>
  </div>
</div>

</div>
<div class="qtip" id="qTooltip"></div>

<script src="js/custom-select.js"></script>
<script src="js/page-setup.js"></script>
<script src="js/worksheet-ui.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/references.js"></script>
<script src="js/assistant.js"></script>
<script>
(function(){
  // page-setup.js overwrites the title block with the dashboard's own.
  var t = document.querySelector(".ttl"); if(t) t.textContent = "AI Assistant";
  var c = document.querySelector(".crumb"); if(c) c.innerHTML = 'DFMEA &rsaquo; <b>AI Assistant</b>';
  var chat = window.DfmeaAI.mountChat(document.getElementById("aiPageChat"), {
    persist: true, alwaysSuggest: true, suggestions: window.DfmeaAI.SUGGESTIONS.concat(["Which files were shared with us?", "How do I use the filters?"]),
    context: function(){ return { page: "ai-assistant.html" }; }, placeholder: "Ask anything about your workspace",
    welcome: "Hello! I am your AI assistant. I can explain a DFMEA or a requirement, tell you why a reference was used, describe the standards in use, or walk you through creating a project. What would you like to know?"
  });
  document.getElementById("aiPageClear").addEventListener("click", chat.clear);
  chat.focus();
})();
</script>
</body></html>
